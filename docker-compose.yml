# No setup script needed — environment variables provide Docker defaults.
# Host directories /opt/nocturne-memory/{data,snapshots,backups} are auto-created.
#
# Architecture: 1 container (backend only)
# - SQLite database file on a mounted volume
# - Frontend static files baked into the image
# - No postgres, no nginx
#
# Usage:
#   Local build:  docker compose up -d --build
#   Pull image:   docker compose pull && docker compose up -d

services:
  backend:
    image: ghcr.io/xyw110/nocturne-memory:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python run_sse.py
    ports:
      - "${APP_PORT:-80}:8233"
    environment:
      SNAPSHOT_DIR: /app/snapshots
      # Docker-appropriate defaults; config.py uses these on first boot
      # when /app/config.json does not exist yet.
      DATABASE_URL: "sqlite+aiosqlite:////app/data/nocturne.db"
      HOST: "0.0.0.0"
      AUTO_OPEN_BROWSER: "false"
      API_TOKEN: "${API_TOKEN:-}"
    volumes:
      - /opt/nocturne-memory/data:/app/data
      - /opt/nocturne-memory/snapshots:/app/snapshots
      - /opt/nocturne-memory/backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8233/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
