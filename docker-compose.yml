services:
  backend:
    image: ghcr.io/xyw110/nocturne-memory:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python run_sse.py
    ports:
      - "38233:8233"
    volumes:
      - /opt/nocturne-memory:/app/persistent
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8233/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true