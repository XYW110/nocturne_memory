# Before running: python scripts/setup_docker.py
# The setup script auto-generates config.json with Docker-appropriate defaults.
#
# Architecture: 1 container (backend only)
# - SQLite database file on a mounted volume
# - Frontend static files baked into the image
# - No postgres, no nginx
#
# Usage:
#   Local build:  docker compose up -d --build
#   Pull image:   docker compose pull && docker compose up -d

services:
  backend:
    image: ghcr.io/xyw110/nocturne-memory:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python run_sse.py
    ports:
      - "${APP_PORT:-80}:8233"
    environment:
      SNAPSHOT_DIR: /app/snapshots
    volumes:
      - /opt/nocturne-memory/data:/app/data
      - /opt/nocturne-memory/snapshots:/app/snapshots
      - /opt/nocturne-memory/backups:/app/backups
      - /opt/nocturne-memory/config.json:/app/config.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8233/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
